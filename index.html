<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>おへやモンスター</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; color: #dfe7ff; }
    #app { position: fixed; inset: 0; z-index: 1; }
    #app canvas { display: block; width: 100%; height: 100%; }
    .veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 18px; background: #0b1020; z-index: 20; padding: 24px; }
    .veil h1 { font-size: 40px; margin: 0; letter-spacing: 2px; }
    .big-btn { font-size: 20px; font-weight: 700; color: #0b1020; background: linear-gradient(135deg,#7cf0ff,#4f8bff);
      border: none; border-radius: 999px; padding: 16px 44px; box-shadow: 0 6px 24px rgba(79,139,255,.45); }
    .hud { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: flex;
      flex-direction: column; justify-content: space-between; padding: 12px 14px; }
    .hud button { pointer-events: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="title" class="veil">
    <h1>おへやモンスター</h1>
    <div id="ver"></div>
    <button id="start">スタート</button>
    <button id="settings-btn" class="big-btn" style="background:linear-gradient(135deg,#5a6b8c,#39435e);color:#fff">設定</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
